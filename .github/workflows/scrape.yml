name: Daily Grant Scraper

# Runs every day at 07:00 AM IST (01:30 UTC)
# Also triggered manually from Actions tab
on:
  schedule:
    - cron: "30 1 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape:
    name: Scrape ICMR and ANRF, update dashboard
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install requests beautifulsoup4 lxml

      - name: Run scraper
        run: python scraper.py
        env:
          TZ: Asia/Kolkata

      - name: Check output file exists
        run: |
          if [ ! -f grants_live.json ]; then
            echo "grants_live.json was not created. Scraper failed."
            exit 1
          fi
          python3 -c "
import json
d = json.load(open('grants_live.json'))
print('Scraped at :', d['scraped_label'])
print('Total grants:', d['total'])
print('By status  :', d['by_status'])
urgent = d.get('urgent_grants', [])
if urgent:
    print('URGENT:', urgent)
"

      - name: Commit and push grants_live.json
        run: |
          git config user.name "grantmap-bot"
          git config user.email "grantmap-bot@noreply.github.com"
          git add grants_live.json
          if git diff --staged --quiet; then
            echo "No changes detected. Skipping commit."
          else
            git commit -m "Auto-update grants_live.json $(date +'%d %b %Y %H:%M IST')"
            git push
            echo "Pushed successfully."
          fi
